<!-- Registration form for username, email, and password -->
<form #registerForm="ngForm" (ngSubmit)="registerUser()">
  <label for="username">Username:</label>
  <input type="text" id="username" name="username" [(ngModel)]="registerUserData.username" required />
  <br />
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" [(ngModel)]="registerUserData.email" required />
  <br />
  <label for="password">Password:</label>
  <input type="password" id="password" name="password" [(ngModel)]="registerUserData.password" required />
  <br />
  <button type="submit">Register</button>
</form>
