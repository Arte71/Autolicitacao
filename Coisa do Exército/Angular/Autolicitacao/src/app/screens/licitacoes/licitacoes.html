<aside>
  <app-menu></app-menu>
</aside>
<div class="licitacoes">
  <h2>Lista de Licitações Externas Disponíveis</h2>
  
    @for (licitacao of licitacoes; track licitacao.idLicitacao) {
    
    <div class="licitacao-item-wrapper"> 
                <button 
            [routerLink]="['relacao-itens', formatarNomeTabela(licitacao)]"
            (click)="selectLicitacao(licitacao)"> 
      
            <div>Título: **{{ licitacao.tituloLicitacao }}**</div>
            <div>Órgão: {{ licitacao.idResponsavel.orgao }}</div>
            <div>Responsável {{ licitacao.idResponsavel.nome }}</div>
            <div>Conclusão: {{ licitacao.dataConclusao| date: 'shortDate' }}</div>
      
        </button>
    </div>

  } @empty {
    <div class="alerta-vazio">
        <p>Nenhuma licitação externa encontrada para visualização.</p>
    </div>
  }
</div>
