<div class="flex flex-col gap-6">
    <app-title main="Aqui eu colocarei as licitações em adamento" 
    sub="exemplo de aplicação angular"
    >
</app-title>

    <div>
         <input 
         type="text"
         placeholder="Adicionar nova tarefa"
         class="input"
         #taskInput
         (keyup.enter)="addTodo($event, taskInput)">
        </div>
    <div>
        @for(item of todos.items(); track item.id){
            <div>
                <span [class.taxado] = "item.completed"> {{ item.title }} </span>
                @if (item.completed) {
  <span>Concluído</span>
                } @else {   
                    <span>pendente</span>
                }

                <div>
                    <button (click) = "todos.toggle(item.id)" [class.btn-secondary] = "item.completed" [class.btn] = "!item.completed">
                        
                    </button>
                </div>
                <div>
                    <button  (click) = "todos.remove(item.id)" class ="btn-danger">
                        

                    </button>
                </div>

            </div>
        }
    </div>
</div>
